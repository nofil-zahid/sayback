name: CI

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main
      - development

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: |
          echo "Building project..."
          npm run build

      - name: Run tests
        run: |
          echo "Running tests..."
          npm run test

      - name: CI completed
        run: echo "Build and tests passed successfully."

      - name: Upload package build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: dist/
          if-no-files-found: error
